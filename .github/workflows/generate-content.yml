name: Generate Content

on:
  schedule:
    # Generate weekly batch every Sunday at 00:00 JST (Saturday 15:00 UTC)
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Generation mode"
        required: true
        type: choice
        options:
          - single
          - weekly
        default: single
      category:
        description: "Category (for single mode): news, tool, comparison, list, opinion, daily"
        required: false
        default: ""
      slot:
        description: "Time slot (for single mode): morning, evening"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'weekly' }}"
          if [ "$MODE" = "weekly" ]; then
            python scripts/generate_content.py weekly
          else
            ARGS="single"
            if [ -n "${{ github.event.inputs.category }}" ]; then
              ARGS="$ARGS --category ${{ github.event.inputs.category }}"
            fi
            if [ -n "${{ github.event.inputs.slot }}" ]; then
              ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
            fi
            python scripts/generate_content.py $ARGS
          fi

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.json
          git diff --staged --quiet || git commit -m "auto: add generated content to queue"
          git push
