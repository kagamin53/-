name: Add Post to Queue

on:
  workflow_dispatch:
    inputs:
      content:
        description: "Post content (the tweet text)"
        required: true
        type: string
      category:
        description: "Category"
        required: false
        type: choice
        options:
          - news
          - tool
          - comparison
          - list
          - opinion
          - daily
        default: news
      slot:
        description: "Time slot"
        required: false
        type: choice
        options:
          - morning
          - evening
          - ""
        default: ""

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add post to queue
        run: |
          ARGS="add"
          ARGS="$ARGS '${{ github.event.inputs.content }}'"
          if [ -n "${{ github.event.inputs.category }}" ]; then
            ARGS="$ARGS --category ${{ github.event.inputs.category }}"
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
          fi
          eval python scripts/manage_queue.py $ARGS

      - name: Commit queue update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.json
          git diff --staged --quiet || git commit -m "auto: add post to queue"
          git push
